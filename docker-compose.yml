services:
  api:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/research_agent
      LANGGRAPH_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/research_agent
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - chroma_data:/app/.chroma
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: research_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d research_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  chroma_data:
